# Production deployment — frontend (nginx :80) + backend (FastAPI :8080)
#
# Setup:
#   cp .env.docker.example .env
#   # Edit .env with Clerk keys and your public site URL
#   docker compose up -d --build
#
# App:     http://localhost
# API:     http://localhost:8080  (also proxied at http://localhost/api/…)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-education-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_data:/app/data
    env_file:
      - backend/.env
    environment:
      - BACKEND_DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - DISABLE_TORCH=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3333,http://127.0.0.1:3333}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-http://localhost,http://127.0.0.1,http://localhost:3333,http://127.0.0.1:3333}
    networks:
      - ai-education-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
        REACT_APP_CLERK_PUBLISHABLE_KEY: ${REACT_APP_CLERK_PUBLISHABLE_KEY}
    env_file:
      - frontend/.env
    container_name: ai-education-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_UPSTREAM=backend:8080
    networks:
      - ai-education-network
    restart: unless-stopped

volumes:
  backend_data:
    driver: local

networks:
  ai-education-network:
    driver: bridge
