# Alias for production — same as docker-compose.yml
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-education-backend-prod
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_data:/app/data
    env_file:
      - .env
    environment:
      - BACKEND_DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES}
    networks:
      - ai-education-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
        REACT_APP_CLERK_PUBLISHABLE_KEY: ${REACT_APP_CLERK_PUBLISHABLE_KEY}
    container_name: ai-education-frontend-prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-education-network
    restart: unless-stopped

volumes:
  backend_data:
    driver: local

networks:
  ai-education-network:
    driver: bridge
