# Local development with hot reload
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ai-education-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - backend_dev_data:/app/data
    env_file:
      - backend/.env
    environment:
      - BACKEND_DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=True
      - ALLOWED_ORIGINS=http://localhost:3333,http://127.0.0.1:3333
      - CLERK_AUTHORIZED_PARTIES=http://localhost:3333,http://127.0.0.1:3333
    command: python3 -m uvicorn app:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - ai-education-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ai-education-frontend-dev
    ports:
      - "3333:3333"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - frontend/.env
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - PORT=3333
      - WDS_SOCKET_HOST=localhost
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - ai-education-network
    command: npm start
    restart: unless-stopped

volumes:
  backend_dev_data:

networks:
  ai-education-network:
    driver: bridge
