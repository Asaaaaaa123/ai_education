services:
  # Backend Development Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: specialcare-backend-dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      # Mount code for hot reload
      - ./backend:/app
      - /app/__pycache__
      # Persistent volume for data files
      - backend_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=True
      - ALLOWED_ORIGINS=http://localhost:3333,http://127.0.0.1:3333
      # Clerk — set in shell or a root .env file before `docker compose up`
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-}
    command: python start.py
    networks:
      - specialcare-network
    restart: unless-stopped

  # Frontend Development Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: specialcare-frontend-dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3333:3333"
    volumes:
      # Mount code for hot reload
      - ./frontend:/app
      - /app/node_modules
    environment:
      # For development, use localhost since browser makes requests
      - REACT_APP_API_URL=http://localhost:8080
      - PORT=3333
      - REACT_APP_CLERK_PUBLISHABLE_KEY=${REACT_APP_CLERK_PUBLISHABLE_KEY:-}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - specialcare-network
    command: npm start
    restart: unless-stopped

volumes:
  # Persistent volume for backend data files
  backend_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/backend/data

networks:
  specialcare-network:
    driver: bridge
